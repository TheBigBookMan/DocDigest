<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocDigest - Invoice Processor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_file.css') }}">
</head>
<body>
    <div class="container">
        <h1>DocDigest</h1>
        <p>Upload your invoice PDF to extract structured data</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <label for="email">To receive response via email</label>
            <input type="email" id="email" name="email" placeholder="Email..." />

            <input type="file" multiple id="fileInput" name="file" accept=".pdf, .txt, .doc, .docx" required>
            <button type="submit">Upload & Process</button>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </form>

        <div id="fileStatusSection" class="file-status-section" style="display: none;">
            <div class="tabs">
                <button class="tab-button active" data-tab="processing">
                    Processing (<span id="processingCount">0</span>)
                </button>
                <button class="tab-button" data-tab="canceled">
                    Failed (<span id="canceledCount">0</span>)
                </button>
            </div>

            <div class="tab-content">
                <div id="processing-tab" class="tab-panel active">
                    <div id="processingFiles" class="file-list"></div>
                </div>

                <div id="canceled-tab" class="tab-panel">
                    <div id="canceledFiles" class="file-list"></div>
                </div>
            </div>
        </div>

        <div id="results" style="display: none;">
            <h2>Extraction Results</h2>
            <pre id="jsonOutput"></pre>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/upload_file.js') }}"></script>
</body>
</html>
