<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocDigest - Invoice Processor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_file.css') }}">
</head>
<body>
    <div class="container">
        <h1>DocDigest</h1>
        <p>Upload your invoice PDF to extract structured data</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" multiple id="fileInput" name="file" accept=".pdf, .txt, .doc, .docx" required>
            <button type="submit">Upload & Process</button>
        </form>

        <div id="results" style="display: none;">
            <h2>Extraction Results</h2>
            <pre id="jsonOutput"></pre>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/upload_file.js') }}"></script>
</body>
</html>
